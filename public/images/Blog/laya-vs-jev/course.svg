      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7a7a7a" stroke="none"/>
    </marker>
    <marker id="arrow-green-course" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#00efa6" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#0a0a0a"/>
  <rect width="1200" height="675" fill="url(#grid-course)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="60" y="72" font-size="26" fill="#c8c8c8">// fig.7 — who designs a harder course?</text>
    <text x="60" y="102" font-size="18" fill="#7a7a7a">each model picks the next obstacle (a choice) and the gap after it (a score).</text>
  </g>
  <rect x="960" y="134" width="12" height="12" fill="#e0692e"/><text x="980" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7a7a7a">jev</text><rect x="1050" y="134" width="12" height="12" fill="#3b95e0"/><text x="1070" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7a7a7a">laya</text>
  <text x="60" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#c8c8c8">difficulty vs speed</text>
  <text x="60" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#7a7a7a">+ means harder obstacles as it speeds up</text>
