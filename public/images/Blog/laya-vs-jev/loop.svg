<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <pattern id="grid-loop" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7a7a7a" stroke="none"/>
    </marker>
    <marker id="arrow-green-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#00efa6" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#0a0a0a"/>
  <rect width="1200" height="675" fill="url(#grid-loop)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="60" y="72" font-size="26" fill="#c8c8c8">// fig.1 — one move, end to end</text>
    <text x="60" y="102" font-size="18" fill="#7a7a7a">the model only picks. everything around it is deterministic and counted.</text>
  </g>
  <rect x="60" y="150" width="230" height="112" fill="#111111" stroke="#00efa6" stroke-width="2"/>
  <text x="76" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#7a7a7a">01</text>
  <text x="112" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#c8c8c8">engine frame</text>
  <text x="76" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7a7a7a">60 fps</text>
  <text x="76" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7a7a7a">16.7 ms per step</text>
  <rect x="343" y="150" width="230" height="112" fill="#111111" stroke="#2a2a2a" stroke-width="2"/>
  <text x="359" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#7a7a7a">02</text>
  <text x="395" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#c8c8c8">snapshot</text>
  <text x="359" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7a7a7a">dino y, velocity,</text>
  <text x="359" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7a7a7a">obstacles, keys</text>
  <rect x="626" y="150" width="230" height="112" fill="#111111" stroke="#00efa6" stroke-width="2"/>
  <text x="642" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#7a7a7a">03</text>
  <text x="678" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#00efa6">planner</text>
  <text x="642" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7a7a7a">labels each move</text>
  <text x="642" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7a7a7a">for this latency</text>
  <rect x="910" y="150" width="230" height="112" fill="#111111" stroke="#2a2a2a" stroke-width="2"/>
  <text x="926" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#7a7a7a">04</text>
  <text x="962" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#c8c8c8">question</text>
  <text x="926" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7a7a7a">text state + one</text>
  <text x="926" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7a7a7a">choice, 3 options</text>
  <rect x="910" y="392" width="230" height="112" fill="#111111" stroke="#7a7a7a" stroke-width="2"/>
  <text x="926" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#7a7a7a">05</text>
  <text x="962" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#c8c8c8">model</text>
  <text x="926" y="458" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#3b95e0">laya · local mlx</text>
  <text x="926" y="484" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#e0692e">jev · https api</text>
  <rect x="626" y="392" width="230" height="112" fill="#111111" stroke="#2a2a2a" stroke-width="2"/>
  <text x="642" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#7a7a7a">06</text>
  <text x="678" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#c8c8c8">probabilities</text>
  <text x="642" y="458" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7a7a7a">jump .37 duck .32</text>
  <text x="642" y="484" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7a7a7a">run .31</text>
  <rect x="343" y="392" width="230" height="112" fill="#111111" stroke="#00efa6" stroke-width="2"/>
  <text x="359" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#7a7a7a">07</text>
  <text x="395" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#00efa6">shields</text>
  <text x="359" y="458" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7a7a7a">plan · arrival</text>
  <text x="359" y="484" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7a7a7a">· emergency</text>
  <rect x="60" y="392" width="230" height="112" fill="#111111" stroke="#2a2a2a" stroke-width="2"/>
  <text x="76" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#7a7a7a">08</text>
  <text x="112" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#c8c8c8">keys</text>
  <text x="76" y="458" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7a7a7a">held until the</text>
  <text x="76" y="484" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7a7a7a">next answer lands</text>
  <line x1="294" y1="206" x2="337" y2="206" stroke="#7a7a7a" stroke-width="2" marker-end="url(#arrow-loop)"/>
  <line x1="339" y1="448" x2="296" y2="448" stroke="#7a7a7a" stroke-width="2" marker-end="url(#arrow-loop)"/>
  <line x1="577" y1="206" x2="620" y2="206" stroke="#7a7a7a" stroke-width="2" marker-end="url(#arrow-loop)"/>
  <line x1="622" y1="448" x2="579" y2="448" stroke="#7a7a7a" stroke-width="2" marker-end="url(#arrow-loop)"/>
  <line x1="860" y1="206" x2="904" y2="206" stroke="#7a7a7a" stroke-width="2" marker-end="url(#arrow-loop)"/>
  <line x1="906" y1="448" x2="862" y2="448" stroke="#7a7a7a" stroke-width="2" marker-end="url(#arrow-loop)"/>
  <line x1="1025" y1="266" x2="1025" y2="386" stroke="#7a7a7a" stroke-width="2" marker-end="url(#arrow-loop)"/>
  <line x1="175" y1="388" x2="175" y2="268" stroke="#00efa6" stroke-width="2" marker-end="url(#arrow-green-loop)"/>
  <text x="189" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#00efa6">next frame</text>
  <rect x="470" y="284" width="400" height="86" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="488" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#c8c8c8">model latency lives in the loop</text>
  <text x="488" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#3b95e0">laya ≈ 2 frames</text>
  <text x="670" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#e0692e">jev ≈ 22 frames</text>
  <rect x="60" y="570" width="16" height="16" fill="none" stroke="#00efa6" stroke-width="2"/>
  <text x="88" y="584" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7a7a7a">deterministic, tested against the engine</text>
  <rect x="640" y="570" width="8" height="16" fill="#3b95e0"/>
  <rect x="648" y="570" width="8" height="16" fill="#e0692e"/>
  <text x="668" y="584" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7a7a7a">the only learned part</text>
  <text x="60" y="616" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7a7a7a">an answer takes effect on the first frame after it arrives</text>
  <g stroke="#2a2a2a" stroke-width="1">
    <path d="M 30 30 L 60 30 M 30 30 L 30 60"/>
    <path d="M 1170 30 L 1140 30 M 1170 30 L 1170 60"/>
    <path d="M 30 645 L 60 645 M 30 645 L 30 615"/>
    <path d="M 1170 645 L 1140 645 M 1170 645 L 1170 615"/>
  </g>
</svg>
