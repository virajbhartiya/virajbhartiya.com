<text x="32" y="40" class="t">// fig.4 — settlement states: T+3 bilateral vs atomic DvP</text>
<text x="32" y="84" class="h">T+3 BILATERAL · 2008</text>
<rect x="32" y="100" width="140" height="48" rx="4" class="box"/><text x="72" y="129">AGREED</text>
<rect x="212" y="100" width="160" height="48" rx="4" class="box"/><text x="242" y="129">CASH SENT</text>
<rect x="412" y="100" width="160" height="48" rx="4" class="box"/><text x="440" y="129">BONDS DUE</text>
<rect x="612" y="100" width="140" height="48" rx="4" class="box" style="stroke:#ff7b72"/><text x="652" y="129" class="r">FAILED</text>
<rect x="792" y="100" width="136" height="48" rx="4" class="box"/><text x="804" y="121" style="font-size:12px">claim / roll /</text><text x="804" y="139" style="font-size:12px">fails charge*</text>
<g stroke="#6e7681" marker-end="url(#a)"><path d="M172 124H208"/><path d="M372 124H408"/><path d="M572 124H608"/><path d="M752 124H788"/></g>
