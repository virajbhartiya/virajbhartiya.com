<rect x="232" y="304" width="200" height="48" rx="4" class="box" style="stroke:#8b949e"/><text x="250" y="333">MEDIATOR VERDICT</text>
<rect x="512" y="282" width="200" height="48" rx="4" class="box" style="stroke:#7ee787"/><text x="526" y="303" class="g">COMMIT</text><text x="526" y="320" class="d">both legs moved</text>
<rect x="512" y="350" width="200" height="48" rx="4" class="box" style="stroke:#ff7b72"/><text x="526" y="371" class="r">REJECT</text><text x="526" y="388" class="d">neither leg moved</text>
