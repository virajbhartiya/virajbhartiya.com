<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none" stroke-linecap="round" stroke-linejoin="round">
<defs><pattern id="grid-settlement" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" stroke="#1a1a1a" stroke-width="1"/></pattern><marker id="a-settlement" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7a7a7a" stroke="none"/></marker><marker id="ag-settlement" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00efa6" stroke="none"/></marker><marker id="ar-settlement" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ff5c5c" stroke="none"/></marker></defs>
<rect width="1200" height="675" fill="#0a0a0a"/><rect width="1200" height="675" fill="url(#grid-settlement)"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<text x="60" y="72" font-size="26" fill="#c8c8c8">// fig.4 — settlement states</text>
<text x="60" y="102" font-size="18" fill="#7a7a7a">in 2008 a failed trade is a state you can sit in. on canton it isn't one.</text>
<text x="60" y="160" font-size="17" fill="#7a7a7a">T+3 BILATERAL · 2008</text>
<rect x="60" y="180" width="170" height="64" fill="#111111" stroke="#2a2a2a" stroke-width="2"/>
<text x="145" y="219" font-size="19" fill="#c8c8c8" text-anchor="middle">AGREED</text>
<rect x="270" y="180" width="190" height="64" fill="#111111" stroke="#2a2a2a" stroke-width="2"/>
<text x="365" y="219" font-size="19" fill="#c8c8c8" text-anchor="middle">CASH SENT</text>
<rect x="500" y="180" width="190" height="64" fill="#111111" stroke="#2a2a2a" stroke-width="2"/>
<text x="595" y="219" font-size="19" fill="#c8c8c8" text-anchor="middle">BONDS DUE</text>
<rect x="730" y="180" width="170" height="64" fill="#111111" stroke="#ff5c5c" stroke-width="2"/>
<text x="815" y="219" font-size="19" fill="#ff5c5c" text-anchor="middle">FAILED</text>
<rect x="940" y="180" width="200" height="64" fill="#111111" stroke="#2a2a2a" stroke-width="2"/>
<text x="1040" y="207" font-size="17" fill="#c8c8c8" text-anchor="middle">claim / roll /</text>
<text x="1040" y="231" font-size="17" fill="#c8c8c8" text-anchor="middle">fails charge*</text>
<path d="M 230 212 H 264" stroke="#7a7a7a" stroke-width="2" marker-end="url(#a-settlement)"/>
<path d="M 460 212 H 494" stroke="#7a7a7a" stroke-width="2" marker-end="url(#a-settlement)"/>
<path d="M 690 212 H 724" stroke="#7a7a7a" stroke-width="2" marker-end="url(#a-settlement)"/>
<path d="M 900 212 H 934" stroke="#7a7a7a" stroke-width="2" marker-end="url(#a-settlement)"/>
<path d="M 815 244 V 292 H 595 V 250" stroke="#ff5c5c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar-settlement)"/>
<text x="705" y="318" font-size="17" fill="#ff5c5c" text-anchor="middle">next day, try again</text>
<text x="365" y="276" font-size="17" fill="#7a7a7a" text-anchor="middle">exposure open ↑</text>
<text x="60" y="390" font-size="17" fill="#7a7a7a">ATOMIC DVP · CANTON</text>
<rect x="60" y="440" width="190" height="64" fill="#111111" stroke="#2a2a2a" stroke-width="2"/>
<text x="155" y="479" font-size="19" fill="#c8c8c8" text-anchor="middle">SUBMITTED</text>
<rect x="300" y="440" width="260" height="64" fill="#111111" stroke="#7a7a7a" stroke-width="2"/>
<text x="430" y="479" font-size="19" fill="#c8c8c8" text-anchor="middle">MEDIATOR VERDICT</text>
<path d="M 250 472 H 294" stroke="#7a7a7a" stroke-width="2" marker-end="url(#a-settlement)"/>
<rect x="640" y="404" width="240" height="72" fill="#111111" stroke="#00efa6" stroke-width="2"/>
<text x="660" y="434" font-size="19" fill="#00efa6">COMMIT</text>
<text x="660" y="460" font-size="17" fill="#7a7a7a">both legs moved</text>
<rect x="640" y="504" width="240" height="72" fill="#111111" stroke="#ff5c5c" stroke-width="2"/>
<text x="660" y="534" font-size="19" fill="#ff5c5c">REJECT</text>
<text x="660" y="560" font-size="17" fill="#7a7a7a">neither leg moved</text>
<path d="M 560 472 H 600 V 440 H 634" stroke="#00efa6" stroke-width="2" marker-end="url(#ag-settlement)"/>
<path d="M 600 472 V 540 H 634" stroke="#ff5c5c" stroke-width="2" marker-end="url(#ar-settlement)"/>
<text x="905" y="478" font-size="17" fill="#c8c8c8">no state where cash</text>
<text x="905" y="504" font-size="17" fill="#c8c8c8">moved and bonds didn't.</text>
<text x="60" y="632" font-size="16" fill="#7a7a7a">* the TMPG fails charge arrived in May 2009, after Treasury fails peaked in October 2008.</text>
</g>
</svg>
