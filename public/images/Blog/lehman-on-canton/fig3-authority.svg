<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none" stroke-linecap="round" stroke-linejoin="round">
<defs><pattern id="grid-authority" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" stroke="#1a1a1a" stroke-width="1"/></pattern><marker id="a-authority" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7a7a7a" stroke="none"/></marker><marker id="ag-authority" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00efa6" stroke="none"/></marker><marker id="ar-authority" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ff5c5c" stroke="none"/></marker></defs>
<rect width="1200" height="675" fill="#0a0a0a"/><rect width="1200" height="675" fill="url(#grid-authority)"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<text x="60" y="72" font-size="26" fill="#c8c8c8">// fig.3 — rehypothecation, by authority</text>
<text x="60" y="102" font-size="18" fill="#7a7a7a">the broker can only move client assets inside a contract the client signed.</text>
<rect x="60" y="160" width="250" height="100" fill="#111111" stroke="#5eafff" stroke-width="2"/>
<text x="80" y="194" font-size="20" fill="#5eafff">RehypoRight</text>
<text x="80" y="222" font-size="17" fill="#c8c8c8">signatory client</text>
<text x="80" y="246" font-size="17" fill="#7a7a7a">cap 140 · used 0</text>
<rect x="350" y="160" width="310" height="100" fill="#111111" stroke="#00efa6" stroke-width="2"/>
<text x="370" y="194" font-size="20" fill="#c8c8c8">Rehypothecate</text>
<text x="370" y="222" font-size="17" fill="#c8c8c8">controller broker</text>
<text x="370" y="246" font-size="17" fill="#00efa6">authority {client, broker}</text>
<rect x="700" y="160" width="300" height="100" fill="#111111" stroke="#00efa6" stroke-width="2"/>
<text x="720" y="194" font-size="20" fill="#c8c8c8">Transfer</text>
<text x="720" y="222" font-size="17" fill="#c8c8c8">controller owner = client</text>
<text x="720" y="246" font-size="17" fill="#00efa6">✓ client ∈ authority</text>
<path d="M 310 210 H 344" stroke="#00efa6" stroke-width="2" marker-end="url(#ag-authority)"/>
<path d="M 660 210 H 694" stroke="#00efa6" stroke-width="2" marker-end="url(#ag-authority)"/>
<path d="M 850 260 V 288 M 620 288 H 1040" stroke="#00efa6" stroke-width="2"/>
<path d="M 620 288 V 312" stroke="#00efa6" stroke-width="2" marker-end="url(#ag-authority)"/>
<path d="M 830 288 V 312" stroke="#00efa6" stroke-width="2" marker-end="url(#ag-authority)"/>
<path d="M 1040 288 V 312" stroke="#00efa6" stroke-width="2" marker-end="url(#ag-authority)"/>
<rect x="520" y="316" width="200" height="70" fill="#111111" stroke="#2a2a2a" stroke-width="2"/>
<text x="538" y="345" font-size="18" fill="#c8c8c8">Holding</text>
<text x="538" y="371" font-size="16" fill="#7a7a7a">owner: lender</text>
<rect x="730" y="316" width="200" height="70" fill="#111111" stroke="#2a2a2a" stroke-width="2"/>
<text x="748" y="345" font-size="18" fill="#c8c8c8">LentOut</text>
<text x="748" y="371" font-size="16" fill="#7a7a7a">observer: client</text>
<rect x="940" y="316" width="200" height="70" fill="#111111" stroke="#2a2a2a" stroke-width="2"/>
<text x="958" y="345" font-size="18" fill="#c8c8c8">RehypoRight</text>
<text x="958" y="371" font-size="16" fill="#7a7a7a">used 100 / 140</text>
<text x="60" y="436" font-size="17" fill="#7a7a7a">WHAT FAILS</text>
<rect x="60" y="456" width="530" height="90" fill="#111111" stroke="#ff5c5c" stroke-width="2"/>
<text x="84" y="492" font-size="19" fill="#c8c8c8">broker calls Transfer directly</text>
<text x="84" y="524" font-size="17" fill="#ff5c5c">authority {broker} · ✗ client missing</text>
<rect x="610" y="456" width="530" height="90" fill="#111111" stroke="#ff5c5c" stroke-width="2"/>
<text x="634" y="492" font-size="19" fill="#c8c8c8">Rehypothecate again: 100+100 &gt; 140</text>
<text x="634" y="524" font-size="17" fill="#ff5c5c">✗ cap check fails → nothing commits</text>
<text x="60" y="592" font-size="17" fill="#7a7a7a">CLIENT'S PARTICIPANT RECEIVES</text>
<text x="60" y="626" font-size="18" fill="#c8c8c8">its Holding archived · the LentOut · the updated RehypoRight</text>
</g>
</svg>
