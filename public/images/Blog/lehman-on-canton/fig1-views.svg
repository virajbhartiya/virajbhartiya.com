<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560"><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#161b22"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7ee787"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff7b72"/></marker></defs><style>text{font-family:"JetBrains Mono","SF Mono",Menlo,monospace;fill:#c9d1d9;font-size:13px}.d{fill:#6e7681;font-size:12px}.h{fill:#8b949e;font-size:12px;letter-spacing:1px}.t{fill:#6e7681;font-size:14px}.b{fill:#79c0ff}.g{fill:#7ee787}.y{fill:#e3b341}.r{fill:#ff7b72}.box{fill:#0d1117;stroke:#30363d}</style><rect width="100%" height="100%" fill="#0d1117"/><rect width="100%" height="100%" fill="url(#g)"/>
<text x="32" y="40" class="t">// fig.1 — one transaction, three views</text>
<text x="32" y="80" class="h">TRANSACTION TREE</text><text x="344" y="80" class="h">SEQUENCER RECEIVES</text><text x="656" y="80" class="h">PARTICIPANTS RECEIVE</text>
<path d="M60 158V294M60 210H76M60 294H76" stroke="#30363d" fill="none"/>
<rect x="32" y="98" width="272" height="60" rx="4" class="box" style="stroke:#79c0ff"/><text x="46" y="122">exercise Accept</text><text x="46" y="144" class="b" style="font-size:12px">view 0 · seller, buyer</text>
<rect x="76" y="182" width="228" height="56" rx="4" class="box" style="stroke:#7ee787"/><text x="90" y="204">exercise Transfer (cash)</text><text x="90" y="226" class="g" style="font-size:12px">view 1 · + CashBank</text>
<rect x="76" y="266" width="228" height="56" rx="4" class="box" style="stroke:#e3b341"/><text x="90" y="288">exercise Transfer (bond)</text><text x="90" y="310" class="y" style="font-size:12px">view 2 · + BondCustodian</text>
<g stroke="#6e7681" marker-end="url(#a)"><path d="M304 128H340"/><path d="M304 210H340"/><path d="M304 294H340"/><path d="M616 128H652"/><path d="M616 210H652"/><path d="M616 294H652"/></g>
<g style="stroke-dasharray:4 3"><rect x="344" y="106" width="272" height="44" rx="4" class="box" style="stroke:#79c0ff"/><rect x="344" y="188" width="272" height="44" rx="4" class="box" style="stroke:#7ee787"/><rect x="344" y="272" width="272" height="44" rx="4" class="box" style="stroke:#e3b341"/></g>
<text x="358" y="133">▓▓▓▓▓▓ → P_seller, P_buyer</text><text x="358" y="215">▓▓▓▓ → P_cashbank</text><text x="358" y="299">▓▓▓▓ → P_bondcust</text>
<text x="344" y="346" class="d">orders + delivers ciphertext.</text><text x="344" y="362" class="d">knows recipients, never contents.</text>
<rect x="656" y="100" width="272" height="56" rx="4" class="box" style="stroke:#79c0ff"/><text x="670" y="123">P_seller, P_buyer</text><text x="670" y="144" class="b" style="font-size:12px">views 0+1+2 · whole tree</text>
<rect x="656" y="182" width="272" height="56" rx="4" class="box" style="stroke:#7ee787"/><text x="670" y="205">P_cashbank</text><text x="670" y="226" class="g" style="font-size:12px">view 1 only · cash leg</text>
<rect x="656" y="266" width="272" height="56" rx="4" class="box" style="stroke:#e3b341"/><text x="670" y="289">P_bondcust</text><text x="670" y="310" class="y" style="font-size:12px">view 2 only · bond leg</text>
<rect x="344" y="388" width="272" height="104" rx="4" class="box" style="stroke:#8b949e"/><text x="358" y="412" class="h">MEDIATOR</text><text x="358" y="434" style="font-size:12px">tree shape + who must confirm.</text><text x="358" y="452" style="font-size:12px">no payload.</text><text x="358" y="478" style="font-size:12px"><tspan class="g">COMMIT all</tspan> <tspan class="d">|</tspan> <tspan class="r">REJECT all</tspan></text>
<path d="M792 322V440H620" fill="none" stroke="#6e7681" style="stroke-dasharray:4 3" marker-end="url(#a)"/><text x="660" y="430" class="d">confirm / reject</text>
<text x="32" y="530" class="d">seller and buyer are informees of the root, so they see every subview. each custodian sees only its own leg.</text>
</svg>
