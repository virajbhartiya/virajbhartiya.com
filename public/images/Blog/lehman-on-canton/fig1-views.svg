<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none" stroke-linecap="round" stroke-linejoin="round">
<defs><pattern id="grid-views" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" stroke="#1a1a1a" stroke-width="1"/></pattern><marker id="a-views" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7a7a7a" stroke="none"/></marker><marker id="ag-views" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00efa6" stroke="none"/></marker><marker id="ar-views" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ff5c5c" stroke="none"/></marker></defs>
<rect width="1200" height="675" fill="#0a0a0a"/><rect width="1200" height="675" fill="url(#grid-views)"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<text x="60" y="72" font-size="26" fill="#c8c8c8">// fig.1 — one transaction, three views</text>
<text x="60" y="102" font-size="18" fill="#7a7a7a">each party gets only its branch. sequencer and mediator never see contents.</text>
<text x="60" y="158" font-size="17" fill="#7a7a7a">TRANSACTION TREE</text>
<text x="450" y="158" font-size="17" fill="#7a7a7a">SEQUENCER RECEIVES</text>
<text x="810" y="158" font-size="17" fill="#7a7a7a">PARTICIPANTS RECEIVE</text>
<path d="M 85 253 V 415 M 85 315 H 110 M 85 415 H 110" stroke="#2a2a2a" stroke-width="2"/>
<rect x="60" y="177" width="330" height="76" fill="#111111" stroke="#5eafff" stroke-width="2"/>
<text x="80" y="208" font-size="20" fill="#c8c8c8">exercise Accept</text>
<text x="80" y="236" font-size="17" fill="#5eafff">view 0 · seller, buyer</text>
<rect x="110" y="277" width="280" height="76" fill="#111111" stroke="#00efa6" stroke-width="2"/>
<text x="130" y="308" font-size="20" fill="#c8c8c8">Transfer (cash)</text>
<text x="130" y="336" font-size="17" fill="#00efa6">view 1 · + CashBank</text>
<rect x="110" y="377" width="280" height="76" fill="#111111" stroke="#e0692e" stroke-width="2"/>
<text x="130" y="408" font-size="20" fill="#c8c8c8">Transfer (bond)</text>
<text x="130" y="436" font-size="17" fill="#e0692e">view 2 · + BondCust</text>
<path d="M 390 215 H 444" stroke="#7a7a7a" stroke-width="2" marker-end="url(#a-views)"/>
<rect x="450" y="189" width="300" height="52" fill="#111111" stroke="#5eafff" stroke-width="2" stroke-dasharray="6 5"/>
<text x="472" y="221" font-size="18" fill="#c8c8c8">▓▓▓▓ → seller, buyer</text>
<path d="M 750 215 H 804" stroke="#7a7a7a" stroke-width="2" marker-end="url(#a-views)"/>
<path d="M 390 315 H 444" stroke="#7a7a7a" stroke-width="2" marker-end="url(#a-views)"/>
<rect x="450" y="289" width="300" height="52" fill="#111111" stroke="#00efa6" stroke-width="2" stroke-dasharray="6 5"/>
<text x="472" y="321" font-size="18" fill="#c8c8c8">▓▓▓ → CashBank</text>
<path d="M 750 315 H 804" stroke="#7a7a7a" stroke-width="2" marker-end="url(#a-views)"/>
<path d="M 390 415 H 444" stroke="#7a7a7a" stroke-width="2" marker-end="url(#a-views)"/>
<rect x="450" y="389" width="300" height="52" fill="#111111" stroke="#e0692e" stroke-width="2" stroke-dasharray="6 5"/>
<text x="472" y="421" font-size="18" fill="#c8c8c8">▓▓▓ → BondCust</text>
<path d="M 750 415 H 804" stroke="#7a7a7a" stroke-width="2" marker-end="url(#a-views)"/>
<rect x="810" y="177" width="330" height="76" fill="#111111" stroke="#5eafff" stroke-width="2"/>
<text x="830" y="208" font-size="20" fill="#c8c8c8">seller + buyer</text>
<text x="830" y="236" font-size="17" fill="#5eafff">whole tree · views 0,1,2</text>
<rect x="810" y="277" width="330" height="76" fill="#111111" stroke="#00efa6" stroke-width="2"/>
<text x="830" y="308" font-size="20" fill="#c8c8c8">CashBank</text>
<text x="830" y="336" font-size="17" fill="#00efa6">view 1 only · cash leg</text>
<rect x="810" y="377" width="330" height="76" fill="#111111" stroke="#e0692e" stroke-width="2"/>
<text x="830" y="408" font-size="20" fill="#c8c8c8">BondCust</text>
<text x="830" y="436" font-size="17" fill="#e0692e">view 2 only · bond leg</text>
<text x="450" y="478" font-size="17" fill="#7a7a7a">ciphertext + recipients only</text>
<rect x="450" y="500" width="300" height="124" fill="#111111" stroke="#7a7a7a" stroke-width="2"/>
<text x="472" y="532" font-size="17" fill="#7a7a7a">MEDIATOR</text>
<text x="472" y="562" font-size="18" fill="#c8c8c8">who must confirm,</text>
<text x="472" y="588" font-size="18" fill="#c8c8c8">never the payload</text>
<text x="472" y="612" font-size="18" xml:space="preserve"><tspan fill="#00efa6">COMMIT all</tspan><tspan fill="#7a7a7a"> | </tspan><tspan fill="#ff5c5c">REJECT all</tspan></text>
<path d="M 975 453 V 562 H 756" stroke="#7a7a7a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-views)"/>
<text x="800" y="552" font-size="17" fill="#7a7a7a">confirm / reject</text>
</g>
</svg>
