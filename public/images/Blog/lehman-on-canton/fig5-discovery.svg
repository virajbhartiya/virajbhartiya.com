<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none" stroke-linecap="round" stroke-linejoin="round">
<defs><pattern id="grid-discovery" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" stroke="#1a1a1a" stroke-width="1"/></pattern><marker id="a-discovery" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7a7a7a" stroke="none"/></marker><marker id="ag-discovery" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#00efa6" stroke="none"/></marker><marker id="ar-discovery" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ff5c5c" stroke="none"/></marker></defs>
<rect width="1200" height="675" fill="#0a0a0a"/><rect width="1200" height="675" fill="url(#grid-discovery)"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<text x="60" y="72" font-size="26" fill="#c8c8c8">// fig.5 — "what do we have?"</text>
<text x="60" y="102" font-size="18" fill="#7a7a7a">2008: years of discovery across 200+ entities. canton: one read of the active contract set.</text>
<text x="60" y="160" font-size="17" fill="#7a7a7a">2008</text>
<rect x="60" y="180" width="235" height="52" fill="#111111" stroke="#2a2a2a" stroke-width="2"/>
<text x="78" y="213" font-size="18" fill="#c8c8c8">LBHI (US)</text>
<rect x="325" y="180" width="235" height="52" fill="#111111" stroke="#2a2a2a" stroke-width="2"/>
<text x="343" y="213" font-size="18" fill="#c8c8c8">LBIE (UK)</text>
<rect x="60" y="244" width="235" height="52" fill="#111111" stroke="#2a2a2a" stroke-width="2"/>
<text x="78" y="277" font-size="18" fill="#c8c8c8">Lehman Japan</text>
<rect x="325" y="244" width="235" height="52" fill="#111111" stroke="#2a2a2a" stroke-width="2"/>
<text x="343" y="277" font-size="18" fill="#c8c8c8">…200+ entities</text>
<rect x="60" y="308" width="235" height="52" fill="#111111" stroke="#2a2a2a" stroke-width="2"/>
<text x="78" y="341" font-size="18" fill="#c8c8c8">bilateral OTC</text>
<rect x="325" y="308" width="235" height="52" fill="#111111" stroke="#2a2a2a" stroke-width="2"/>
<text x="343" y="341" font-size="18" fill="#c8c8c8">paper confirms</text>
<rect x="60" y="372" width="500" height="52" fill="#111111" stroke="#2a2a2a" stroke-width="2"/>
<text x="78" y="405" font-size="18" fill="#c8c8c8">80+ insolvency regimes · 21 countries</text>
<path d="M 310 424 V 458" stroke="#ff5c5c" stroke-width="2" marker-end="url(#ar-discovery)"/>
<rect x="60" y="464" width="500" height="80" fill="#111111" stroke="#ff5c5c" stroke-width="2"/>
<text x="84" y="498" font-size="19" fill="#c8c8c8">reconcile ↔ dispute</text>
<text x="84" y="528" font-size="17" fill="#ff5c5c">"our records show X, yours show Y"</text>
<text x="60" y="590" font-size="19" fill="#ff5c5c">→ over a decade of claims</text>
<path d="M 600 150 V 620" stroke="#2a2a2a" stroke-width="2"/>
<text x="640" y="160" font-size="17" fill="#7a7a7a">CANTON</text>
<rect x="640" y="180" width="300" height="92" fill="#111111" stroke="#5eafff" stroke-width="2"/>
<text x="662" y="212" font-size="20" fill="#c8c8c8">estate participant</text>
<text x="662" y="238" font-size="17" fill="#5eafff">active contract set</text>
<text x="662" y="260" font-size="17" fill="#7a7a7a">already stored</text>
<path d="M 790 272 V 316" stroke="#00efa6" stroke-width="2" marker-end="url(#ag-discovery)"/>
<text x="806" y="302" font-size="17" fill="#00efa6">GetActiveContracts @ offset N</text>
<rect x="640" y="322" width="500" height="200" fill="#111111" stroke="#00efa6" stroke-width="2"/>
<text x="664" y="360" font-size="18" fill="#5eafff">Repo</text>
<text x="780" y="360" font-size="17" fill="#7a7a7a">× n · cpty, cash, maturity</text>
<text x="664" y="394" font-size="18" fill="#5eafff">OtcSwap</text>
<text x="780" y="394" font-size="17" fill="#7a7a7a">× n · cpty, notional, terms</text>
<text x="664" y="428" font-size="18" fill="#5eafff">LentOut</text>
<text x="780" y="428" font-size="17" fill="#7a7a7a">× n · whose asset, to whom</text>
<text x="664" y="462" font-size="18" fill="#5eafff">Holding</text>
<text x="780" y="462" font-size="17" fill="#7a7a7a">× n · custody positions</text>
<text x="664" y="500" font-size="17" fill="#7a7a7a">one stream, one consistent cut</text>
<text x="640" y="566" font-size="17" xml:space="preserve"><tspan fill="#c8c8c8">every counterparty holds the </tspan><tspan fill="#00efa6">same contract IDs</tspan><tspan fill="#c8c8c8">.</tspan></text>
<text x="640" y="596" font-size="17" fill="#c8c8c8">nothing to reconcile. courts decide priority.</text>
